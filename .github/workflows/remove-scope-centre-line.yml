name: Apply silent oscilloscope fix

on:
  push:
    branches: [Release-1.0]
    paths:
      - .github/workflows/remove-scope-centre-line.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Release-1.0
      - name: Patch silent trace rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Source/PluginEditor.cpp')
          s=p.read_text(encoding='utf-8')
          old='''        for(int c=0;c<columns;++c){if(bucketHi[size_t(c)]<bucketLo[size_t(c)])continue;const float x=plot.getX()+float(c)*span;float a=plot.getCentreY()-bucketHi[size_t(c)]*plot.getHeight()*.5f,b=plot.getCentreY()-bucketLo[size_t(c)]*plot.getHeight()*.5f;if(b-a<1.1f){const float m=(a+b)*.5f;a=m-.55f;b=m+.55f;}pathTop.push_back({x,a});pathBottom.push_back({x,b});}'''
          new='''        for(int c=0;c<columns;++c){if(bucketHi[size_t(c)]<bucketLo[size_t(c)])continue;const float lo=bucketLo[size_t(c)],hi=bucketHi[size_t(c)];if(juce::jmax(std::abs(lo),std::abs(hi))<=1e-5f)continue;const float x=plot.getX()+float(c)*span;const float a=plot.getCentreY()-hi*plot.getHeight()*.5f,b=plot.getCentreY()-lo*plot.getHeight()*.5f;pathTop.push_back({x,a});pathBottom.push_back({x,b});}'''
          if old not in s: raise SystemExit('target render loop not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "Rainline Music"
          git config user.email "74309432+RainlineMusic@users.noreply.github.com"
          git add Source/PluginEditor.cpp
          git rm .github/workflows/remove-scope-centre-line.yml
          git commit -m "Hide oscilloscope trace during silence"
          git push origin HEAD:Release-1.0
